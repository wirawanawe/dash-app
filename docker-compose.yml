version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pr1k1t1w}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-phc_dashboard}
      MYSQL_USER: ${MYSQL_USER:-phc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pr1k1t1w}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - phc-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-pr1k1t1w}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Next.js Application
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-pr1k1t1w}
      - DB_NAME=${DB_NAME:-phc_dashboard}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey123456789supersecretkey123456789}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - phc-network
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - docker.env

  # phpMyAdmin (optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pr1k1t1w}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - phc-network

volumes:
  mysql_data:

networks:
  phc-network:
    driver: bridge
